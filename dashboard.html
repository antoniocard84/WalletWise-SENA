<!DOCTYPE html>
<html lang="es">
<head>
    <!-- ====================================================================
         METADATOS Y RECURSOS
         ==================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalletWise - Dashboard</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <!-- Estilos Personalizados Globales -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #eaf3ff 0%, #dcecff 100%);
        }
    </style>
</head>
<body class="min-h-screen flex justify-center items-center px-0 md:px-4">

    <!-- ====================================================================
         CONTENEDOR PRINCIPAL DEL DASHBOARD
         ==================================================================== -->
    <main class="w-full max-w-[410px] bg-white min-h-screen md:min-h-[840px] md:rounded-[35px] shadow-2xl flex flex-col overflow-hidden relative">

        <!-- ----------------------------------------------------------------
             1. ENCABEZADO Y BALANCE GENERAL
             ---------------------------------------------------------------- -->
        <header class="bg-white p-6 border-b border-slate-100 shadow-sm">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-xs text-slate-400 font-medium">Balance Total</p>
                    <h1 id="balance" class="text-3xl font-bold text-slate-800 mt-0.5">
                        $ 0
                    </h1>
                </div>

                <!-- Botón para añadir una nueva transacción -->
                <button
                    type="button"
                    onclick="window.location.href='transaccion.html'"
                    aria-label="Agregar nueva transacción"
                    class="w-12 h-12 bg-gradient-to-r from-blue-500 to-sky-500 text-white rounded-2xl flex items-center justify-center font-bold text-xl shadow-lg hover:scale-105 transition cursor-pointer"
                >
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </header>

        <!-- ----------------------------------------------------------------
             2. CUERPO DE CONTENIDO CON DESPLAZAMIENTO (SCROLL)
             ---------------------------------------------------------------- -->
        <div class="flex-1 overflow-y-auto p-6 space-y-6">

            <!-- RESUMEN DE INGRESOS Y GASTOS -->
            <section class="grid grid-cols-2 gap-3">
                <!-- Tarjeta de Ingresos -->
                <div class="bg-blue-50/70 border border-blue-100 p-4 rounded-2xl shadow-sm">
                    <div class="flex items-center gap-2 mb-1">
                        <i class="fa-solid fa-arrow-down-left text-blue-500 text-xs"></i>
                        <p class="text-xs font-semibold text-blue-600">Ingresos</p>
                    </div>
                    <h2 id="ingresos" class="text-xl font-bold text-blue-900">
                        $ 0
                    </h2>
                </div>

                <!-- Tarjeta de Gastos -->
                <div class="bg-slate-50 border border-slate-200/60 p-4 rounded-2xl shadow-sm">
                    <div class="flex items-center gap-2 mb-1">
                        <i class="fa-solid fa-arrow-up-right text-slate-500 text-xs"></i>
                        <p class="text-xs font-semibold text-slate-600">Gastos</p>
                    </div>
                    <h2 id="gastos" class="text-xl font-bold text-slate-800">
                        $ 0
                    </h2>
                </div>
            </section>

            <!-- CONFIGURACIÓN DE ALERTA DE PRESUPUESTO -->
            <section class="bg-white border border-slate-100 p-5 rounded-3xl shadow-sm space-y-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-bell text-amber-500 text-sm"></i>
                        <h3 class="font-bold text-slate-800 text-sm">Límite de Gastos</h3>
                    </div>
                    <!-- Badge del Estado de la Alerta -->
                    <span id="estadoAlerta" class="text-[11px] px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 font-semibold">
                        No definido
                    </span>
                </div>

                <div class="flex gap-2">
                    <input 
                        type="number" 
                        id="limiteGastoInput" 
                        placeholder="Monto máximo (Ej: 500)" 
                        class="w-full h-11 bg-slate-50 border border-slate-200 rounded-xl px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                    >
                    <button 
                        type="button" 
                        onclick="guardarLimiteGasto()" 
                        class="bg-gradient-to-r from-blue-500 to-sky-500 text-white font-semibold px-4 rounded-xl text-sm shadow-md hover:scale-[1.02] transition cursor-pointer"
                    >
                        Guardar
                    </button>
                </div>
            </section>

            <!-- HISTORIAL DE MOVIMIENTOS RECIENTES -->
            <section>
                <h3 class="font-bold text-slate-800 mb-4 text-base flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-blue-500"></i>
                    Movimientos Recientes
                </h3>

                <!-- Contenedor dinámico (inyectado desde app.js) -->
                <div id="listaMovimientos" class="space-y-3"></div>
            </section>

        </div>

        <!-- ----------------------------------------------------------------
             3. PIE DE PÁGINA (FOOTER) FIJO
             ---------------------------------------------------------------- -->
        <footer class="bg-white border-t border-slate-100 p-5 text-center">
            <button
                type="button"
                onclick="cerrarSesion()"
                class="w-full h-12 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl font-semibold transition cursor-pointer flex items-center justify-center gap-2"
            >
                <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
                Cerrar Sesión
            </button>
            <p class="text-xs text-slate-400 mt-3">
                © 2026 WalletWise. Desarrollado por Antony & Gabriela.
            </p>
        </footer>

        <!-- ----------------------------------------------------------------
             4. MODAL ESTÉTICO DE ALERTA (OCULTO POR DEFECTO)
             ---------------------------------------------------------------- -->
        <div id="modalAlerta" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-center items-center px-4 hidden transition-opacity duration-300">
            <div class="bg-white w-full max-w-xs rounded-[30px] p-6 shadow-2xl text-center border border-red-100">
                <!-- Ícono de Advertencia -->
                <div class="w-14 h-14 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto text-2xl mb-3 shadow-inner">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>

                <!-- Textos -->
                <h2 class="text-lg font-bold text-slate-800 mb-1">¡Presupuesto Excedido!</h2>
                <p class="text-slate-500 text-xs mb-4">
                    Has superado el límite de gasto que tenías configurado.
                </p>

                <!-- Cuadro resumen de montos -->
                <div class="bg-red-50/80 border border-red-100 rounded-2xl p-3 mb-5 text-xs text-red-700 space-y-1">
                    <p class="flex justify-between">
                        <span class="text-red-500">Límite fijado:</span>
                        <strong>$<span id="modalLimiteMonto">0</span></strong>
                    </p>
                    <p class="flex justify-between">
                        <span class="text-red-500">Gastos actuales:</span>
                        <strong>$<span id="modalGastoActual">0</span></strong>
                    </p>
                </div>

                <!-- Botón de Confirmación -->
                <button 
                    type="button" 
                    onclick="cerrarModalAlerta()" 
                    class="w-full h-11 bg-gradient-to-r from-red-500 to-rose-500 text-white font-semibold rounded-xl shadow-lg hover:opacity-90 transition cursor-pointer"
                >
                    Entendido
                </button>
            </div>
        </div>

    </main>

    <!-- Lógica de Negocio JS -->
    <script src="js/app.js"></script>

</body>
</html>
